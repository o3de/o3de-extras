name: Simulation Gems PR Test

on:
  pull_request:
    branches:
      - development
      - 'stabilization/**'
    paths:
      - 'Gems/LevelGeoreferencing/**'
      - 'Gems/ROS2/**'
      - 'Gems/ROS2Controllers/**'
      - 'Gems/ROS2RobotImporter/**'
      - 'Gems/ROS2Sensors/**'
      - 'Gems/SimulationInterfaces/**'
      - '.github/workflows/simulation-gems-pr.yml'
      - '.github/workflows/gems-build.yml'

concurrency:
  group: simulation-gems-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Simulation gems
    uses: ./.github/workflows/gems-build.yml
    with:
      simulation: true
