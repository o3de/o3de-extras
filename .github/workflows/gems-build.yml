name: Gems Build

# Reusable build of o3de-extras gems in a minimal O3DE test project. Called by:
#   simulation-gems-pr.yml - PRs touching the simulation gems
#   other-gems-pr.yml      - PRs touching the other gems
#   gems-scheduled.yml     - nightly (simulation), weekly and manual runs (both groups)
# Gem groups:
#   simulation - LevelGeoreferencing, ROS2*, SimulationInterfaces: build + unit tests.
#   other      - AzQtComponentsForPython, OptickProfiler, TracyProfiler, MachineLearning,
#                OpenXRVk, XR: build only ("does it compile?").
#   all        - both groups in one job, so the engine compiles once.
# Concurrency is set by the callers; a group here would clash with theirs.

on:
  workflow_call:
    inputs:
      simulation:
        description: 'Build and test the simulation gems'
        type: boolean
        default: false
      other:
        description: 'Build the other gems (build only, no tests)'
        type: boolean
        default: false
      engine_ref:
        description: 'o3de engine branch/ref; defaults to the PR base branch, else development'
        type: string
        default: ''
      skip_if_cached:
        description: 'Skip the build if a cache for this engine + o3de-extras commit already exists'
        type: boolean
        default: false

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  # runs-on can't read a step output in its own job, so resolve it here first.
  resolve-engine-config:
    name: Resolve engine config
    runs-on: ubuntu-latest
    outputs:
      engine_sha: ${{ steps.parse.outputs.sha }}
      image: ${{ steps.parse.outputs.image }}
      clang_version: ${{ steps.parse.outputs.clang_version }}
      gcc_version: ${{ steps.parse.outputs.gcc_version }}
      cmake_version: ${{ steps.parse.outputs.cmake_version }}
      ros_distro: ${{ steps.parse.outputs.ros_distro }}
      cache_key: ${{ steps.cache-keys.outputs.key }}
      cache_restore_keys: ${{ steps.cache-keys.outputs.restore_keys }}
      cache_up_to_date: ${{ steps.cache-lookup.outputs.cache-hit }}
    steps:
      # base_ref names the matching engine branch; empty on workflow_dispatch and schedule runs.
      - name: Checkout engine ar.yml (${{ inputs.engine_ref || github.base_ref || 'development' }})
        uses: actions/checkout@v7
        with:
          repository: o3de/o3de
          ref: ${{ inputs.engine_ref || github.base_ref || 'development' }}
          path: engine
          sparse-checkout: |
            .github/workflows/ar.yml
          sparse-checkout-cone-mode: false

      # Mirrors the engine's own toolchain; ROS distro is derived since engine has no ROS concept.
      - name: Parse engine Linux-Profile config
        id: parse
        working-directory: engine
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          sudo apt-get update
          sudo apt-get install -y python3-yaml
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          import yaml

          ROS_DISTRO_BY_IMAGE = {
              "ubuntu-22.04": "humble",
              "ubuntu-24.04": "jazzy",
              "ubuntu-26.04": "lyrical",
          }

          try:
              with open(".github/workflows/ar.yml") as f:
                  ar_yml = yaml.safe_load(f)
              job = ar_yml["jobs"]["Linux-Profile"]["with"]
          except FileNotFoundError:
              sys.exit(
                  "::error::engine/.github/workflows/ar.yml not found. "
                  "Unable to resolve the engine config."
              )
          except KeyError:
              sys.exit(
                  "::error::jobs.Linux-Profile.with not found in ar.yml. "
                  "The engine's ar.yml layout may have changed - update the "
                  "parsing logic in this workflow to match."
              )

          try:
              image = job["image"]
              clang_version = job["clang_version"]
              gcc_version = job["gcc_version"]
              cmake_version = job["cmake_version"]
          except KeyError as e:
              sys.exit(
                  f"::error::jobs.Linux-Profile.with.{e.args[0]} not found in ar.yml. "
                  "The engine's ar.yml layout may have changed - update the "
                  "parsing logic in this workflow to match."
              )

          ros_distro = ROS_DISTRO_BY_IMAGE.get(image)
          if ros_distro is None:
              sys.exit(
                  f"::error::No ROS 2 distro mapping for engine image '{image}'. "
                  "Add one to ROS_DISTRO_BY_IMAGE in this workflow."
              )

          print(f"image={image}")
          print(f"clang_version={clang_version}")
          print(f"gcc_version={gcc_version}")
          print(f"cmake_version={cmake_version}")
          print(f"ros_distro={ros_distro}")
          PY

      - name: Require at least one gem group
        if: ${{ !inputs.simulation && !inputs.other }}
        run: |
          echo "::error::Neither the simulation nor the other gem group was requested."
          exit 1

      # Key: <toolchain>-<group>-<engine sha>-<extras sha>, so an engine or toolchain bump busts the cache.
      # Restore order: same engine commit first, then the freshest older cache. The weekly (all) run
      # prefers the previous nightly over last week's run: a one-day-old engine gives more ccache hits.
      - name: Compute cache keys
        id: cache-keys
        env:
          PREFIX: gems-${{ steps.parse.outputs.image }}-${{ steps.parse.outputs.ros_distro }}-clang${{ steps.parse.outputs.clang_version }}
          ENGINE_SHA: ${{ steps.parse.outputs.sha }}
          GROUP: ${{ inputs.simulation && inputs.other && 'all' || inputs.simulation && 'simulation' || 'other' }}
        run: |
          case "$GROUP" in
            simulation) same="simulation all"; older="simulation all" ;;
            other)      same="other all";      older="other all" ;;
            all)        same="all simulation"; older="simulation all" ;;
          esac
          echo "key=${PREFIX}-${GROUP}-${ENGINE_SHA}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "restore_keys<<EOF"
            for g in $same; do echo "${PREFIX}-${g}-${ENGINE_SHA}-"; done
            for g in $older; do echo "${PREFIX}-${g}-"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # skip_if_cached (scheduled runs): skip the build if this engine + o3de-extras commit was already built and cached.
      # Paths must match the cache steps in the linux job exactly (they are part of the cache version).
      - name: Check for an up-to-date cache
        id: cache-lookup
        if: inputs.skip_if_cached
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ~/.o3de/3rdParty
          key: ${{ steps.cache-keys.outputs.key }}
          lookup-only: true

  linux:
    name: Linux ${{ inputs.simulation && inputs.other && 'all' || inputs.simulation && 'simulation' || 'other' }} (${{ needs.resolve-engine-config.outputs.image }} / ROS 2 ${{ needs.resolve-engine-config.outputs.ros_distro }})
    needs: resolve-engine-config
    if: needs.resolve-engine-config.outputs.cache_up_to_date != 'true'
    runs-on: ${{ needs.resolve-engine-config.outputs.image }}
    env:
      ENGINE_PATH: ${{ github.workspace }}/engine
      EXTRAS_PATH: ${{ github.workspace }}/o3de-extras
      PROJECT_PATH: ${{ github.workspace }}/Project
      ROS_DISTRO: ${{ needs.resolve-engine-config.outputs.ros_distro }}
      BUILD_SIMULATION: ${{ inputs.simulation }}
      BUILD_OTHER: ${{ inputs.other }}
    steps:
      - name: Checkout o3de-extras
        uses: actions/checkout@v7
        with:
          path: o3de-extras

      # The other group pulls in Atom, EMotionFX and PhysX; make room on the runner's disk.
      - name: Free disk space
        if: env.BUILD_OTHER == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      # Pinned to the SHA resolve-engine-config already resolved.
      # Excludes the largest unrelated gems and most of AutomatedTesting
      # (clones only about 40% of a full engine's size without LFS content).
      - name: Checkout o3de engine (${{ needs.resolve-engine-config.outputs.engine_sha }})
        uses: actions/checkout@v7
        with:
          repository: o3de/o3de
          ref: ${{ needs.resolve-engine-config.outputs.engine_sha }}
          path: ${{ env.ENGINE_PATH }}
          sparse-checkout: |
            /engine.json
            /CMakeLists.txt
            /CMakePresets.json
            /Assets
            /AutomatedTesting/Gem/PythonTests/EditorPythonTestTools
            /Code
            /cmake
            /scripts
            /python
            /Registry
            /Templates
            /Tools
            /Gems/*
            !/Gems/AtomContent
            !/Gems/AtomLyIntegration/TechnicalArt
            !/Gems/AtomTressFX
            !/Gems/DevTextures
            !/Gems/GameStateSamples
            !/Gems/LyShineExamples
            !/Gems/MotionMatching
            !/Gems/ScriptCanvasTesting
            !/Gems/Vegetation
          sparse-checkout-cone-mode: false

      - name: Drop excluded gems from external_subdirectories lists
        working-directory: ${{ env.ENGINE_PATH }}
        run: |
          jq '.external_subdirectories -= [
            "Gems/AtomContent", "Gems/AtomTressFX", "Gems/DevTextures",
            "Gems/GameStateSamples", "Gems/LyShineExamples", "Gems/MotionMatching",
            "Gems/ScriptCanvasTesting", "Gems/Vegetation"
          ]' engine.json > /tmp/engine.json
          mv /tmp/engine.json engine.json
          jq '.external_subdirectories -= ["TechnicalArt/DccScriptingInterface"]' \
            Gems/AtomLyIntegration/gem.json > /tmp/atomly.json
          mv /tmp/atomly.json Gems/AtomLyIntegration/gem.json

      # The simulation build fills about 1.2 GB of ccache; the limit leaves room for the other group.
      - name: Setup ccache
        uses: chocobo1/setup-ccache-action@a4d08616f5b614053bce228ddf881592f69d61d4 # v1.5.9
        with:
          prepend_symlinks_to_path: false
          store_cache: false
          restore_cache: false
          ccache_options: |
            cache_dir=${{ github.workspace }}/.ccache
            hash_dir=false
            max_size=5G

      # Restored and saved in separate steps so failed runs still store what they compiled.
      - name: Restore ccache and 3rdParty packages
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ~/.o3de/3rdParty
          key: ${{ needs.resolve-engine-config.outputs.cache_key }}
          restore-keys: ${{ needs.resolve-engine-config.outputs.cache_restore_keys }}

      - name: Install CMake matching the engine's ar.yml
        uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
        with:
          cmakeVersion: ${{ needs.resolve-engine-config.outputs.cmake_version }}

      - name: Install clang / gcc matching the engine's ar.yml
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-${{ needs.resolve-engine-config.outputs.gcc_version }} g++-${{ needs.resolve-engine-config.outputs.gcc_version }}
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh ${{ needs.resolve-engine-config.outputs.clang_version }}
          sudo apt-get install -y lld-${{ needs.resolve-engine-config.outputs.clang_version }} clang-tools-${{ needs.resolve-engine-config.outputs.clang_version }}
          echo "CC=$(which clang-${{ needs.resolve-engine-config.outputs.clang_version }})" >> "$GITHUB_ENV"
          echo "CXX=$(which clang++-${{ needs.resolve-engine-config.outputs.clang_version }})" >> "$GITHUB_ENV"

      # Install engine's build dependencies.
      - name: Install O3DE Linux build dependencies
        working-directory: ${{ env.ENGINE_PATH }}/scripts/build/build_node/Platform/Linux
        run: sudo ./install-ubuntu.sh

      # Add the ROS 2 apt repo using the ros2-apt-source package.
      # Ref: https://github.com/ros-infrastructure/ros-apt-source
      - name: Add ROS 2 apt repository
        if: env.BUILD_SIMULATION == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ROS_APT_SOURCE_VERSION=$(gh release view --repo ros-infrastructure/ros-apt-source --json tagName --jq .tagName)
          UBUNTU_CODENAME=$(. /etc/os-release && echo "$UBUNTU_CODENAME")
          gh release download "${ROS_APT_SOURCE_VERSION}" --repo ros-infrastructure/ros-apt-source \
            --pattern "ros2-apt-source_${ROS_APT_SOURCE_VERSION}.${UBUNTU_CODENAME}_all.deb" \
            --output /tmp/ros2-apt-source.deb --clobber
          sudo dpkg -i /tmp/ros2-apt-source.deb

      # Install ROS 2 packages. gazebo-msgs only exists for humble/jazzy.
      - name: Install ROS 2 ${{ env.ROS_DISTRO }} packages required by the gems
        if: env.BUILD_SIMULATION == 'true'
        run: |
          PACKAGES="ros-dev-tools \
            ros-${ROS_DISTRO}-ros-base \
            ros-${ROS_DISTRO}-ackermann-msgs \
            ros-${ROS_DISTRO}-control-toolbox \
            ros-${ROS_DISTRO}-joy \
            ros-${ROS_DISTRO}-tf2-ros \
            ros-${ROS_DISTRO}-urdfdom \
            ros-${ROS_DISTRO}-rmw-cyclonedds-cpp \
            ros-${ROS_DISTRO}-xacro \
            ros-${ROS_DISTRO}-radar-msgs \
            ros-${ROS_DISTRO}-depth-image-proc \
            ros-${ROS_DISTRO}-vision-msgs \
            ros-${ROS_DISTRO}-simulation-interfaces \
            python3-colcon-common-extensions \
            python3-vcstool \
            xvfb \
            libevdev-dev \
            libevdev2 \
            libxcb-cursor0"
          if [ "$ROS_DISTRO" = "humble" ] || [ "$ROS_DISTRO" = "jazzy" ]; then
            PACKAGES="$PACKAGES ros-${ROS_DISTRO}-gazebo-msgs"
          fi
          sudo apt-get update
          sudo apt-get install -y $PACKAGES

      - name: Set up O3DE's bundled Python and register engine
        working-directory: ${{ env.ENGINE_PATH }}
        run: |
          ./python/get_python.sh
          ./scripts/o3de.sh register --this-engine

      # MinimalProject's default gems (Atom/CameraFramework/ImGui) are only needed by the other group.
      - name: Create test project
        run: |
          "${{ env.ENGINE_PATH }}/scripts/o3de.sh" create-project \
            --project-path "${{ env.PROJECT_PATH }}" \
            --project-name GemsTest \
            --template-name MinimalProject
          if [ "$BUILD_OTHER" != true ]; then
            jq '.gem_names -= ["Atom", "CameraFramework", "ImGui"]' \
              "${{ env.PROJECT_PATH }}/project.json" > /tmp/project.json
            mv /tmp/project.json "${{ env.PROJECT_PATH }}/project.json"
          fi

      - name: Register and enable o3de-extras gems in the test project
        run: |
          "${{ env.ENGINE_PATH }}/scripts/o3de.sh" register --all-gems-path "${{ env.EXTRAS_PATH }}/Gems"
          GEMS=""
          if [ "$BUILD_SIMULATION" = true ]; then
            GEMS="$GEMS LevelGeoreferencing ROS2 ROS2Controllers ROS2Sensors ROS2RobotImporter SimulationInterfaces"
          fi
          if [ "$BUILD_OTHER" = true ]; then
            # The first four are engine gems the other group links against without declaring them.
            GEMS="$GEMS EditorPythonBindings EMotionFX PhysX5 ScriptCanvas"
            GEMS="$GEMS AzQtComponentsForPython MachineLearning OpenXRVk OptickProfiler TracyProfiler XR"
          fi
          for gem in $GEMS; do
            "${{ env.ENGINE_PATH }}/scripts/o3de.sh" enable-gem \
              --project-path "${{ env.PROJECT_PATH }}" \
              --gem-name "$gem"
          done

      - name: Configure
        id: configure
        run: |
          if [ "$BUILD_SIMULATION" = true ]; then source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash; fi
          cmake -B "${{ env.PROJECT_PATH }}/build/linux" -S "${{ env.PROJECT_PATH }}" \
            -G "Ninja Multi-Config" \
            -DLY_3RDPARTY_PATH="$HOME/.o3de/3rdParty" \
            -DLY_UNITY_BUILD=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      # Test target names are per-gem, not uniform.
      - name: Build simulation gems and test targets
        id: build-simulation
        if: env.BUILD_SIMULATION == 'true'
        timeout-minutes: 330
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          cmake --build "${{ env.PROJECT_PATH }}/build/linux" --config profile --target \
            LevelGeoreferencing LevelGeoreferencing.Editor \
            ROS2 ROS2.Editor \
            ROS2Controllers ROS2Controllers.Editor \
            ROS2RobotImporter ROS2RobotImporter.Editor \
            ROS2Sensors ROS2Sensors.Editor \
            SimulationInterfaces SimulationInterfaces.Editor \
            LevelGeoreferencing.Tests LevelGeoreferencing.Editor.Tests \
            ROS2.Editor.Tests \
            ROS2Controllers.Tests ROS2Controllers.Editor.Tests \
            ROS2RobotImporter.Editor.Tests \
            ROS2Sensors.Tests \
            SimulationInterfaces.Tests SimulationInterfaces.Editor.Tests SimulationInterfaces.ROS2Tests \
            -- -j "$(nproc)"

      - name: Run simulation gem tests
        if: ${{ !cancelled() && steps.build-simulation.outcome == 'success' }}
        run: |
          source /opt/ros/${{ env.ROS_DISTRO }}/setup.bash
          xvfb-run --auto-servernum --server-args="-screen 0 1400x1050x16" \
            ctest --test-dir "${{ env.PROJECT_PATH }}/build/linux" -C profile \
              --output-on-failure \
              --output-junit Testing/test-results.xml \
              --tests-regex "(LevelGeoreferencing\.Tests|LevelGeoreferencing\.Editor\.Tests|ROS2\.Editor\.Tests|ROS2Controllers\.Tests|ROS2Controllers\.Editor\.Tests|ROS2RobotImporter\.Editor\.Tests|ROS2Sensors\.Tests|SimulationInterfaces\.Tests|SimulationInterfaces\.Editor\.Tests|SimulationInterfaces\.ROS2Tests)"

      - name: Upload test results
        if: ${{ !cancelled() && env.BUILD_SIMULATION == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: simulation-gems-test-results
          path: ${{ env.PROJECT_PATH }}/build/linux/Testing/
          retention-days: 14

      # Runs even if the simulation group failed, so both groups report independently.
      # Targets missing from this configuration (e.g. a PAL trait turned the gem off) are reported as warnings.
      - name: Build other gems
        if: ${{ !cancelled() && steps.configure.outcome == 'success' && env.BUILD_OTHER == 'true' }}
        timeout-minutes: 330
        run: |
          BUILD_DIR="${{ env.PROJECT_PATH }}/build/linux"
          available=$(ninja -C "$BUILD_DIR" -f build-profile.ninja -t targets all | cut -d: -f1)
          targets=()
          for t in \
            AzQtComponentsForPython AzQtComponentsForPython.Editor \
            MachineLearning MachineLearning.Editor \
            OpenXRVk OpenXRVk.Builders \
            OptickProfiler \
            TracyProfiler \
            XR; do
            if grep -qxF "$t" <<<"$available"; then
              targets+=("$t")
            else
              echo "::warning::Target $t is not defined in this configuration; skipping it."
            fi
          done
          if [ ${#targets[@]} -eq 0 ]; then
            echo "::error::None of the other gem targets are defined."
            exit 1
          fi
          cmake --build "$BUILD_DIR" --config profile --target "${targets[@]}" -- -j "$(nproc)"

      - name: Save ccache and 3rdParty packages
        if: ${{ !cancelled() && steps.cache-restore.outcome == 'success' && steps.cache-restore.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ github.workspace }}/.ccache
            ~/.o3de/3rdParty
          key: ${{ needs.resolve-engine-config.outputs.cache_key }}
